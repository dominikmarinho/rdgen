name: Load Kinimod build configuration
description: Fetch private build settings using GitHub Actions OIDC
inputs:
  zip_password:
    required: false
  zip_path:
    required: false
runs:
  using: composite
  steps:
    - name: Authenticate build and load settings
      shell: python
      run: |
        import json, os, re, urllib.request, urllib.parse
        workflow = os.environ["GITHUB_WORKFLOW_REF"]
        match = re.search(r"/generator-(windows|linux|android)\.yml@", workflow)
        if not match:
            raise RuntimeError("Unexpected build workflow")
        audience = "https://acesso.remoto.api.br/kinimod/build"
        url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(audience, safe="")
        request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
        with urllib.request.urlopen(request, timeout=30) as response:
            token = json.load(response)["value"]
        print("::add-mask::" + token)
        request = urllib.request.Request(
            audience + "/config/" + match.group(1),
            headers={"Authorization": "Bearer " + token},
        )
        with urllib.request.urlopen(request, timeout=30) as response:
            settings = json.load(response)
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
            for key, value in settings.items():
                if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                    raise RuntimeError("Invalid environment variable")
                value = str(value)
                if "\n" in value or "\r" in value:
                    raise RuntimeError("Multiline value is not supported")
                print("::add-mask::" + value)
                target.write(key + "=" + value + "\n")
        print("Authenticated configuration loaded")
