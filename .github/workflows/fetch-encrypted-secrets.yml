name: Prepare Kinimod build
on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare compatibility artifact
        run: echo "Configuration is loaded through authenticated OIDC" > secrets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
